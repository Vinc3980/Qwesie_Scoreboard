name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qwesie_tv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d qwesie_tv_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qwesie_tv_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/qwesie_tv_test?schema=public
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/qwesie_tv_test?schema=public
      JWT_SECRET: ci-test-secret-change-me-32chars-minimum
      NODE_ENV: test
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prisma generate
        run: npm run prisma:generate
      - name: Prisma migrate
        run: npm --workspace=server exec prisma migrate deploy
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Server tests
        run: npm run test --workspace=server

  e2e:
    runs-on: ubuntu-latest
    needs: build-test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qwesie_tv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d qwesie_tv_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qwesie_tv_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/qwesie_tv_test?schema=public
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/qwesie_tv_test?schema=public
      JWT_SECRET: ci-test-secret-change-me-32chars-minimum
      NODE_ENV: test
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prisma generate
        run: npm run prisma:generate
      - name: Prisma migrate
        run: npm --workspace=server exec prisma migrate deploy
      - name: Build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Playwright tests
        run: npm run test:e2e --workspace=client
        continue-on-error: true

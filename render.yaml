services:
  - type: web
    name: qwesie-tv
    runtime: docker
    plan: starter
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_CLIENT
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: qwesie-tv-db
          property: connectionString
      - key: APP_BASE_URL
        sync: false

databases:
  - name: qwesie-tv-db
    plan: free
    databaseName: qwesie_tv
    user: qwesie
